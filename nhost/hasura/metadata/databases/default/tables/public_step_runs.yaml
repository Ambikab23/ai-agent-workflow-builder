table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - input
        - output
        - status
        - completed_at
        - created_at
        - started_at
        - id
        - workflow_run_id
        - workflow_step_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - input
        - output
        - status
        - completed_at
        - created_at
        - started_at
        - id
        - workflow_run_id
        - workflow_step_id
      filter: {}
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - input
        - output
        - status
        - completed_at
        - created_at
        - started_at
        - id
        - workflow_run_id
        - workflow_step_id
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
